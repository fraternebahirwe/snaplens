<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SnapLens</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div id="topbar">
      <span class="brand">SnapLens</span>
      <button id="flip" title="Flip camera" aria-label="Flip camera">🔄</button>
    </div>

    <div id="message" hidden></div>
    <div id="rec" hidden><i></i><span id="timer">0:00</span></div>

    <div id="bottom">
      <div id="filters" role="listbox" aria-label="Filters"></div>
      <div class="shutter-row">
        <button id="lensBtn" aria-label="Open lenses">✨</button>
        <button id="shutter" aria-label="Take photo (tap) or video (hold)"><span></span></button>
        <i class="spacer"></i>
      </div>
      <p class="hint">Tap for a photo · Hold for a video</p>
    </div>

    <section id="lensSheet" hidden aria-label="Lenses">
      <div class="grab"></div>
      <div class="tabs" role="tablist">
        <button id="closeSheet" aria-label="Close lenses">⌄</button>
        <button class="tab" data-tab="recents"><b>🕘</b>Recents</button>
        <button class="tab" data-tab="favourites"><b>♡</b>Favourites</button>
        <button class="tab active" data-tab="foryou"><b>✨</b>For you</button>
        <button class="tab" data-tab="aesthetic"><b>💅</b>Aesthetic</button>
        <button class="tab" data-tab="games"><b>🎮</b>Games</button>
        <button id="searchBtn" aria-label="Search lenses">🔍</button>
      </div>
      <input id="lensSearch" type="search" placeholder="Search lenses" hidden>
      <div id="lensGrid"></div>
    </section>

    <div id="preview" hidden>
      <img id="previewImg" alt="">
      <video id="previewVid" controls playsinline loop></video>
      <div class="actions">
        <button id="discard">✖ Discard</button>
        <button id="share" hidden>📤 Share</button>
        <a id="save" download>⬇ Save</a>
      </div>
    </div>
  </div>
  <script src="filters.js"></script>
  <script type="module" src="tracker.js"></script>
  <script src="lenses.js"></script>
  <script src="app.js"></script>
  <script src="explorer.js"></script>
</body>
</html>
